<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile</title>
    <style>
        :root { --primary: #2563eb; }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont,
                         Roboto, sans-serif;
            background: #f4f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05),
                        0 10px 15px -3px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 580px;
        }
        h2 {
            margin: 0 0 6px;
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .sub { color: #64748b; font-size: 13px; margin: 0 0 24px; }

        /* error */
        .error-banner {
            background: #fef2f2;
            border: 1.5px solid #ef4444;
            border-radius: 6px;
            padding: 12px 16px;
            color: #991b1b;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            color: #334155;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        textarea { resize: vertical; height: 85px; }

        /* section titles */
        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            border-top: 1.5px solid #e2e8f0;
            padding-top: 20px;
            margin: 28px 0 16px;
        }
        .section-title-first {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            margin: 0 0 14px;
        }

        /* photo upload */
        .photo-upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s, background 0.2s;
            background: #f8fafc;
        }
        .photo-upload-area:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }
        .photo-upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .photo-preview-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .photo-preview-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            display: none;
        }
        .upload-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto;
        }
        .upload-main-text {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }
        .upload-main-text span { color: var(--primary); }
        .upload-sub-text { font-size: 12px; color: #94a3b8; }
        .upload-filename {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            display: none;
            margin-top: 4px;
        }

        /* two col */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 480px) { .two-col { grid-template-columns: 1fr; } }

        /* sliders */
        .slider-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .slider-row label { margin: 0; }
        .pct { font-size: 13px; font-weight: 700; color: var(--primary); }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            outline: none;
            margin-bottom: 16px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* buttons */
        .btn-row { display: flex; gap: 10px; margin-top: 26px; }
        .btn {
            flex: 1; padding: 13px; font-size: 14px;
            font-weight: 600; border: none; border-radius: 6px;
            cursor: pointer; font-family: inherit;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary  { background: var(--primary); color: #fff; }
        .btn-primary:hover  { background: #1d4ed8; }
        .btn-secondary { background: #64748b; color: #fff; }
        .btn-secondary:hover { background: #475569; }
    </style>
</head>
<body>
<div class="container">
    <h2>Create Digital Profile</h2>
    <p class="sub">Fill in the form below to generate your developer profile card.</p>

    <div class="error-banner" id="errorBanner">
        <span id="errorText"></span>
    </div>

    <!-- enctype required for photo upload -->
    <form action="ProfileController" method="POST"
          enctype="multipart/form-data">

        <!-- Photo Upload -->
        <div class="section-title-first">Profile Photo</div>
        <div class="form-group">
            <div class="photo-upload-area" id="uploadArea">
                <input type="file"
                       name="photo"
                       id="photoInput"
                       accept="image/jpeg,image/png,image/gif"
                       onchange="handlePhotoSelect(this)">
                <div class="photo-preview-wrap">
                    <img id="photoPreview"
                         class="photo-preview-img"
                         src="" alt="Preview">
                    <div class="upload-icon-wrap" id="uploadIcon">
                        &#128247;
                    </div>
                    <div class="upload-main-text" id="uploadMainText">
                        <span>Click to upload</span> your profile photo
                    </div>
                    <div class="upload-sub-text">
                        JPG, PNG or GIF &mdash; max 5MB
                    </div>
                    <div class="upload-filename" id="uploadFilename"></div>
                </div>
            </div>
        </div>

        <!-- Basic Info -->
        <div class="section-title">Basic Information</div>
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="fullName" required
                   placeholder="e.g. Ahmad Aziq bin Abdullah">
        </div>
        <div class="form-group">
            <label>Student ID</label>
            <input type="text" name="studentId"
                   placeholder="e.g. 2025420992">
        </div>
        <div class="form-group">
            <label>Academic Program</label>
            <input type="text" name="program"
                   placeholder="e.g. Bachelor of Computer Science (Hons)">
        </div>
        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" required
                   placeholder="e.g. aziq@student.uitm.edu.my">
        </div>
        <div class="form-group">
            <label>Hobbies</label>
            <input type="text" name="hobbies"
                   placeholder="e.g. Gaming, UI/UX Design, Photography">
        </div>
        <div class="form-group">
            <label>Professional Bio</label>
            <textarea name="bio"
                      placeholder="Tell us about your background and goals..."></textarea>
        </div>

        <!-- Socials -->
        <div class="section-title">Socials &amp; Networks</div>
        <div class="form-group">
            <label>Personal Website</label>
            <input type="text" name="website"
                   placeholder="https://yoursite.com">
        </div>
        <div class="two-col">
            <div class="form-group">
                <label>GitHub</label>
                <input type="text" name="github" placeholder="yourusername">
            </div>
            <div class="form-group">
                <label>Twitter / X</label>
                <input type="text" name="twitter" placeholder="@yourhandle">
            </div>
            <div class="form-group">
                <label>Instagram</label>
                <input type="text" name="instagram" placeholder="yourusername">
            </div>
            <div class="form-group">
                <label>Facebook</label>
                <input type="text" name="facebook" placeholder="Your Name">
            </div>
        </div>

        <!-- Skill Metrics -->
        <div class="section-title">Skill Metrics</div>

        <div class="slider-row">
            <label>Web Design</label>
            <span class="pct" id="p1">80%</span>
        </div>
        <input type="range" name="webDesign" min="0" max="100" value="80"
               oninput="document.getElementById('p1').textContent=this.value+'%'">

        <div class="slider-row">
            <label>Website Markup</label>
            <span class="pct" id="p2">72%</span>
        </div>
        <input type="range" name="webMarkup" min="0" max="100" value="72"
               oninput="document.getElementById('p2').textContent=this.value+'%'">

        <div class="slider-row">
            <label>One Page Design</label>
            <span class="pct" id="p3">89%</span>
        </div>
        <input type="range" name="onePage" min="0" max="100" value="89"
               oninput="document.getElementById('p3').textContent=this.value+'%'">

        <div class="slider-row">
            <label>Mobile Template</label>
            <span class="pct" id="p4">55%</span>
        </div>
        <input type="range" name="mobileTemplate" min="0" max="100" value="55"
               oninput="document.getElementById('p4').textContent=this.value+'%'">

        <div class="slider-row">
            <label>Backend / API</label>
            <span class="pct" id="p5">66%</span>
        </div>
        <input type="range" name="backendApi" min="0" max="100" value="66"
               oninput="document.getElementById('p5').textContent=this.value+'%'">

        <!-- Buttons -->
        <div class="btn-row">
            <button type="submit" class="btn btn-primary">
                Save Profile
            </button>
            <button type="button" class="btn btn-secondary"
                    onclick="location.href='ProfileController?action=list'">
                View All
            </button>
        </div>

    </form>
</div>

<script>
    var err = new URLSearchParams(window.location.search).get("error");
    if (err) {
        document.getElementById("errorText").textContent = err;
        document.getElementById("errorBanner").style.display = "flex";
    }

    function handlePhotoSelect(input) {
        var file = input.files[0];
        if (!file) return;
        var preview  = document.getElementById("photoPreview");
        var icon     = document.getElementById("uploadIcon");
        var mainText = document.getElementById("uploadMainText");
        var filename = document.getElementById("uploadFilename");
        var area     = document.getElementById("uploadArea");
        var reader   = new FileReader();
        reader.onload = function(e) {
            preview.src           = e.target.result;
            preview.style.display = "block";
            icon.style.display    = "none";
            mainText.innerHTML    = "<span>Photo selected</span> — click to change";
            filename.textContent  = file.name;
            filename.style.display = "block";
            area.style.borderColor = "#2563eb";
            area.style.background  = "#eff6ff";
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
